# Render Blueprint: one Docker web service serves the existing public site,
# admin dashboard and API from the same origin. PostgreSQL remains on Neon.
#
# CURRENT FREE CONFIGURATION:
# - One instance only; no multi-instance load balancing is active.
# - Keep the paid scaling settings below commented out while using the Free plan.
#
# WHEN READY TO UPGRADE:
# 1. Change plan from "free" to "starter" (or another eligible paid compute plan).
# 2. Uncomment numInstances: 2 below. Render automatically provisions two instances
#    and load-balances incoming requests between healthy instances. No proxy/load
#    balancer process needs to be installed inside this Node.js application.
# 3. Before syncing this change, complete the multi-instance checklist in
#    docs/SCALING.md. In particular, replace process-local rate limiting and make
#    the scheduled publisher single-run across instances.
services:
  - type: web
    name: portfolio-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # PAID MULTI-INSTANCE SETTINGS — enable only after the checklist is complete:
    # plan: starter
    # numInstances: 2
    healthCheckPath: /api/health
    autoDeploy: true # Live service deploys on main pushes immediately; GitHub Actions checks do not gate this deploy.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: TRUST_PROXY
        value: "true"
      - key: AUTO_MIGRATE
        value: "true"
      - key: DB_POOL_MAX
        value: "3"
      - key: SESSION_HOURS
        value: "8"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: STORAGE_PROVIDER
        value: dbrij
      - key: DBRIJ_S3_ENDPOINT
        value: https://s3.dbrij.com
      - key: DBRIJ_S3_REGION
        value: auto
      - key: DBRIJ_BUCKET
        sync: false
      - key: DBRIJ_KEY_ID
        sync: false
      - key: DBRIJ_KEY_SECRET
        sync: false
      - key: DBRIJ_MEDIA_PUBLIC_BASE
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ENFORCE_SITE_HOST
        value: "false"
      - key: SITE_HOST_ALLOWLIST
        sync: false
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: EMAIL_PROVIDER
        value: log
      - key: EMAIL_FROM_NAME
        value: Portfolio Website
      - key: AI_PROVIDER
        value: rules
      - key: RETENTION_DAYS
        value: "400"
